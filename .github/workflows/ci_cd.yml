name: CI/CD Pipeline - DuckDB Analytics

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test-and-execute:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  enable-cache: true

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version-file: ".python-version"

            - name: Install Dependencies
              run: uv sync --frozen

            - name: Run Pytest & Measure Coverage
              run: |
                  uv run python -m pytest --cov=scripts tests/

            - name: Execute Main Pipeline via CLI
              run: |
                  uv run python scripts/main.py --period 2026-04
