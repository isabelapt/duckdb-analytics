name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Opcional: Adiciona contexto simples se o Copilot precisar analisar o ambiente
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
