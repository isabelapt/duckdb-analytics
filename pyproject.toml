[project]
name = "duckdb-analytics"
version = "0.1.0"
description = "NYC Yellow Taxi Data Reliability Hub & Analytics Engineering Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "pyarrow<19",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=scripts --cov-report=term-missing"
